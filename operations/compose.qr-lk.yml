name: orbe-qr-lk
services:
  worker:
    image: python:3.13-alpine
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -u, /app/qr_worker.py]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - /opt/orbe/whatsapp/operations/qr_worker.py:/app/qr_worker.py:ro
      - /opt/orbe/whatsapp/private/qr-lk/config.json:/private/qr-lk.json:ro
      - /opt/orbe/whatsapp/data/qr-lk:/data
    networks:
      private:
        aliases: [orbe-qr-worker]
      outbound: {}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '0.10'
    pids_limit: 50
    logging:
      driver: local
      options: {max-size: 1m, max-file: '2'}
networks:
  private:
    external: true
    name: orbe-whatsapp_evolution_private
  outbound:
    external: true
    name: orbe-whatsapp_evolution_outbound
